<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070b">
<title>Defeat the Evil Wizard | Touch Play</title>
<style>
:root{color-scheme:dark;--gold:#e6be76;--ink:#f5f1e8;--edge:#8391a5;--control:38px;--joy:82px;--alpha:.72}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100dvh;overflow:hidden;background:#05070b;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{font:600 12px/1 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
.touch-stage{position:fixed;inset:0;background:#05070b;touch-action:none}
#game{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#05070b;touch-action:none}
#status{position:absolute;left:50%;top:max(7px,env(safe-area-inset-top));z-index:25;transform:translateX(-50%);max-width:min(72vw,560px);padding:5px 10px;border:1px solid #7c6b4c;border-radius:999px;background:#0c1119dd;color:#f1d9a8;text-align:center;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#status.ready{display:none}
.controls{position:absolute;inset:0;z-index:20;pointer-events:none}
.move-cluster,.action-cluster,.utility-cluster{position:absolute;pointer-events:none}
.move-cluster{left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:var(--joy);display:grid;justify-items:center;gap:5px}
.action-cluster{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,var(--control));gap:6px}
.utility-cluster{right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;gap:6px}
.touch-stage[data-hand="left"] .move-cluster{left:auto;right:max(12px,env(safe-area-inset-right))}
.touch-stage[data-hand="left"] .action-cluster{right:auto;left:max(12px,env(safe-area-inset-left))}
.touch-stage[data-hand="left"] .utility-cluster{right:auto;left:max(12px,env(safe-area-inset-left))}
.touch-stage[data-size="standard"]{--control:44px;--joy:94px}
.round,.joy,.stick-knob{pointer-events:auto;display:grid;place-items:center;border-radius:50%;touch-action:none;-webkit-tap-highlight-color:transparent}
.round{width:var(--control);height:var(--control);border:1.5px solid #92a0b5;background:radial-gradient(circle at 35% 25%,#334052e8,#101722d9 72%);box-shadow:inset 0 0 0 1px #111722,0 2px 8px #0008;color:#fff;font:800 calc(var(--control)*.42)/1 system-ui;opacity:var(--alpha);backdrop-filter:blur(4px)}
.round.primary{border-color:var(--gold);background:radial-gradient(circle at 35% 25%,#72572cdd,#211b14df 72%)}
.round.utility{width:34px;height:34px;font-size:15px}
.round:active,.round.pressed{opacity:1;transform:scale(.94);border-color:#ffe0a2;box-shadow:0 0 12px #e6be7677,inset 0 0 0 1px #17110a}
.round svg{width:48%;height:48%;fill:none;stroke:currentColor;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
.joy{position:relative;width:var(--joy);height:var(--joy);border:2px solid #8c99ab;background:radial-gradient(circle,#101824bb 34%,#05080db5 72%);box-shadow:inset 0 0 0 6px #27334599,0 4px 14px #0009;opacity:.62}
.joy.active{opacity:.9;border-color:var(--gold)}
.stick-knob{position:absolute;left:29%;top:29%;width:42%;height:42%;pointer-events:none;border:1px solid #8d9aab;background:radial-gradient(circle at 30% 28%,#5d6c80ee,#202a38e8 72%)}
.crouch{width:32px;height:32px;font-size:16px}
.orientation-gate{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:28px;background:radial-gradient(circle at 50% 20%,#283548,#070a10 65%);text-align:center}
.orientation-card{width:min(520px,100%);padding:28px 24px;border:1px solid #8694a7;border-radius:18px;background:#101722f4;box-shadow:0 24px 80px #000d}
.orientation-icon{display:block;font-size:54px;line-height:1;margin-bottom:14px;color:var(--gold)}
.orientation-card h1{margin:0 0 10px;font-size:clamp(26px,8vw,42px);line-height:1.03;color:#f5d399}
.orientation-card p{margin:0;color:#cbd3de;font:500 15px/1.5 system-ui}
.orientation-card strong{color:#fff}
@media(orientation:portrait){.touch-stage{visibility:hidden;pointer-events:none}.orientation-gate{display:flex}}
@media(max-height:430px) and (orientation:landscape){:root{--control:34px;--joy:74px}.touch-stage[data-size="standard"]{--control:39px;--joy:84px}.action-cluster{gap:5px}.move-cluster{gap:3px}.round.utility{width:30px;height:30px}}
@media(max-width:700px) and (orientation:landscape){.move-cluster{left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom))}.action-cluster{right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));gap:4px}.touch-stage[data-hand="left"] .move-cluster{right:max(8px,env(safe-area-inset-right))}.touch-stage[data-hand="left"] .action-cluster{left:max(8px,env(safe-area-inset-left))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="touch-stage" id="touch-stage" data-evil-wizard-console data-size="compact" data-hand="right" aria-label="Defeat the Evil Wizard touch game">
  <iframe id="game" title="Defeat the Evil Wizard game" src="./index.html" allow="gamepad; fullscreen" allowfullscreen tabindex="0"></iframe>
  <div id="status" role="status" aria-live="polite">Loading game…</div>
  <div class="controls" aria-label="Floating touch controls">
    <section class="move-cluster" aria-label="Movement controls">
      <div id="joystick" class="joy" role="slider" aria-label="Movement joystick" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" tabindex="0"><div id="knob" class="stick-knob"></div></div>
      <button class="round crouch" data-action="move_down" aria-label="Crouch">↓</button>
    </section>
    <section class="action-cluster" aria-label="Action controls">
      <button class="round primary" data-action="attack" aria-label="Attack" title="Attack"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 14V8a3 3 0 0 1 6 0V6a3 3 0 0 1 6 0v1a3 3 0 0 1 5 2v6a3 3 0 0 1 4 3v1c0 6-4 10-10 10h-4C7 29 4 24 4 19v-4a3 3 0 0 1 3-1Z"/></svg></button>
      <button class="round primary" data-action="jump" aria-label="Jump" title="Jump">↑</button>
      <button class="round" data-action="heavy_attack" aria-label="Heavy attack" title="Heavy attack">⚔</button>
      <button class="round" data-action="dash" aria-label="Dash" title="Dash">»</button>
      <button class="round" data-action="ability_one" aria-label="Ability one" title="Ability one">✦</button>
      <button class="round" data-action="ability_two" aria-label="Ability two" title="Ability two">✧</button>
      <button class="round" data-action="ultimate" aria-label="Ultimate" title="Ultimate">★</button>
      <button class="round" data-action="interact" aria-label="Interact" title="Interact">✋</button>
    </section>
    <section class="utility-cluster" aria-label="Game controls">
      <button class="round utility" data-action="pause" aria-label="Pause or resume">Ⅱ</button>
    </section>
  </div>
</main>
<div class="orientation-gate" role="status" aria-live="polite">
  <div class="orientation-card"><span class="orientation-icon" aria-hidden="true">↻</span><h1>Turn your screen sideways</h1><p>Phone and tablet play uses landscape so the game remains visible around the floating controls. Rotate your device to continue. <strong>Your selected champion will start automatically.</strong></p></div>
</div>
<script>
'use strict';
(() => {
  const channel='evil-wizard-console/v1';
  const stage=document.getElementById('touch-stage'),game=document.getElementById('game'),joystick=document.getElementById('joystick'),knob=document.getElementById('knob'),status=document.getElementById('status');
  const params=new URLSearchParams(location.search);
  const hero=params.get('hero')||'warrior';
  const size=params.get('size')==='standard'?'standard':'compact';
  const hand=params.get('hand')==='left'?'left':'right';
  stage.dataset.size=size;stage.dataset.hand=hand;

  const held=new Map();let joystickPointer=null,armed=false,started=false,bridgeReady=false;
  const landscape=()=>matchMedia('(orientation:landscape)').matches;
  const send=(kind,extra={})=>{if(armed&&game.contentWindow)game.contentWindow.postMessage({channel,kind,...extra},location.origin)};
  function maybeStart(){
    if(started||!bridgeReady||!landscape())return;
    started=true;send('start',{hero_class:hero});status.textContent='Opening story — tap INTERACT to continue';
  }
  function press(pointer,action){const key=`${pointer}:${action}`;if(held.has(key))return;held.set(key,action);send('button',{action,pressed:true,pointer:key})}
  function release(pointer,action){const key=`${pointer}:${action}`;if(!held.delete(key))return;send('button',{action,pressed:false,pointer:key})}
  function clearAll(){for(const [key,action] of held)send('button',{action,pressed:false,pointer:key});held.clear();knob.style.transform='';joystick.classList.remove('active');joystickPointer=null;document.querySelectorAll('.round.pressed').forEach(b=>b.classList.remove('pressed'));send('reset')}
  function centerStick(e){
    const r=joystick.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width*.34),y=(e.clientY-r.top-r.height/2)/(r.height*.34),length=Math.max(1,Math.hypot(x,y)),dx=x/length,dy=y/length;
    knob.style.transform=`translate(${dx*62}%,${dy*62}%)`;joystick.setAttribute('aria-valuenow',String(Math.round(dx*100)));
    const pointer=`stick-${e.pointerId}`,active=new Set();if(dx<-.25)active.add('move_left');if(dx>.25)active.add('move_right');if(dy>.5)active.add('move_down');
    for(const name of ['move_left','move_right','move_down'])active.has(name)?press(pointer,name):release(pointer,name);
  }
  joystick.addEventListener('pointerdown',e=>{if(joystickPointer!==null)return;e.preventDefault();joystickPointer=e.pointerId;joystick.classList.add('active');joystick.setPointerCapture(e.pointerId);centerStick(e)});
  joystick.addEventListener('pointermove',e=>{if(e.pointerId===joystickPointer){e.preventDefault();centerStick(e)}});
  function stopStick(e){if(e.pointerId!==joystickPointer)return;const pointer=`stick-${e.pointerId}`;for(const name of ['move_left','move_right','move_down'])release(pointer,name);joystickPointer=null;knob.style.transform='';joystick.classList.remove('active');joystick.setAttribute('aria-valuenow','0')}
  ['pointerup','pointercancel','lostpointercapture'].forEach(type=>joystick.addEventListener(type,stopStick));
  for(const button of document.querySelectorAll('button[data-action]')){
    const action=button.dataset.action;
    button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);button.classList.add('pressed');press(`button-${e.pointerId}`,action);if(action==='pause')release(`button-${e.pointerId}`,action);try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{})}catch(_){}});
    const stop=e=>{release(`button-${e.pointerId}`,action);button.classList.remove('pressed')};
    ['pointerup','pointercancel','lostpointercapture'].forEach(type=>button.addEventListener(type,stop));
    button.addEventListener('contextmenu',e=>e.preventDefault());
  }
  window.addEventListener('message',e=>{
    if(e.source!==game.contentWindow||e.origin!==location.origin||!e.data)return;
    if(e.data.type==='evil-wizard/hello'){game.contentWindow.postMessage({channel,kind:'init'},location.origin);return}
    if(e.data.type==='evil-wizard/ready'){armed=true;bridgeReady=true;status.textContent=landscape()?'Game ready — starting…':'Game ready — rotate sideways';maybeStart();return}
    if(e.data.type==='evil-wizard/state'&&e.data.playing===true){status.classList.add('ready');game.focus()}
    else if(e.data.type==='evil-wizard/state'&&started){status.textContent='Opening story — tap INTERACT to continue';status.classList.remove('ready')}
  });
  const orientationChanged=()=>{clearAll();if(landscape()){status.classList.remove('ready');status.textContent=bridgeReady?'Game ready — starting…':'Loading game…';maybeStart()}};
  matchMedia('(orientation:landscape)').addEventListener?.('change',orientationChanged);
  window.addEventListener('orientationchange',orientationChanged);
  for(const type of ['gesturestart','gesturechange','gestureend'])document.addEventListener(type,e=>e.preventDefault(),{passive:false});
  document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
  window.addEventListener('blur',clearAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearAll()});
  game.addEventListener('load',()=>{if(!armed)status.textContent='Loading game…'});
  fetch('./index.html',{method:'HEAD',cache:'no-store'}).then(r=>{if(!r.ok)status.textContent=`Game file blocked by server (HTTP ${r.status})`}).catch(()=>{status.textContent='Cannot reach game file'});
  window.setTimeout(()=>{if(!armed&&!status.textContent.includes('HTTP'))status.textContent='Game is taking longer than expected to load'},20000);
})();
</script>
</body>
</html>
