name: Godot Web build

on:
  push:
    branches: [main, feature/mobile-touch-web-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and single-threaded Web templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl --fail --location --retry 4 --retry-delay 5 \
            --output "$RUNNER_TEMP/godot.zip" \
            'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  '"$RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          test -f "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl --fail --location --retry 4 --retry-delay 5 \
            --output "$RUNNER_TEMP/templates.tpz" \
            'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz'
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  '"$RUNNER_TEMP/templates.tpz" | sha256sum --check
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -p "$RUNNER_TEMP/templates.tpz" templates/web_nothreads_release.zip > "$TEMPLATE_DIR/web_nothreads_release.zip"
          unzip -p "$RUNNER_TEMP/templates.tpz" templates/web_nothreads_debug.zip > "$TEMPLATE_DIR/web_nothreads_debug.zip"
          test -s "$TEMPLATE_DIR/web_nothreads_release.zip"
          test -s "$TEMPLATE_DIR/web_nothreads_debug.zip"
          "$GODOT_BIN" --headless --version

      - name: Import game resources
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --editor --import --quit

      - name: Export browser game
        run: |
          set -euo pipefail
          mkdir -p build/web
          "$GODOT_BIN" --headless --path . --export-release Web build/web/index.html
          for file in index.html index.js index.wasm index.pck; do
            test -s "build/web/$file" || { echo "Missing or empty: build/web/$file"; exit 1; }
          done

      - name: Upload downloadable browser build
        uses: actions/upload-artifact@v4
        with:
          name: evil-wizard-web-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14
